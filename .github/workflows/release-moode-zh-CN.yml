name: Release moOde WebUI Simplified Chinese

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag
        required: true
        default: moode-webui-zh-CN-2026.11.1
      release_title:
        description: Release title
        required: true
        default: moOde WebUI 简体中文 2026.11.1

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: i18n/zh-CN
          fetch-depth: 0

      - name: Verify Chinese WebUI copy
        shell: bash
        run: |
          set -euo pipefail
          test -f www-zh-CN/header.php
          test -f www-zh-CN/js/moode-zh-CN.js
          test -f www-zh-CN/README-zh-CN.md
          test "$(find www-zh-CN -type f | wc -l)" -ge 600
          php -l www-zh-CN/header.php
          node --check www-zh-CN/js/moode-zh-CN.js

      - name: Package full www-zh-CN directory
        shell: bash
        run: |
          set -euo pipefail
          zip -qr www-zh-CN.zip www-zh-CN
          unzip -t www-zh-CN.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG_NAME" www-zh-CN.zip \
            --title "$RELEASE_TITLE" \
            --target i18n/zh-CN \
            --notes "Standalone Simplified Chinese moOde WebUI copy. Original www/ remains unchanged. Dropdown option values and user media metadata are intentionally not translated."
